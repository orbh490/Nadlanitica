spring.application.name=nadlanitic
server.port=${PORT:8080}
# מאחורי ה-proxy של שרת האחסון, כתובת הלקוח האמיתית מגיעה ב-X-Forwarded-For. native = RemoteIpValve של Tomcat:
# קורא את הכותרת מימין ומאמין רק לכתובות proxy פנימיות, כך שלקוח לא יכול לזייף כתובת ולעקוף את הגבלת הלידים.
server.forward-headers-strategy=native
# DB בזיכרון, לא קובץ - כדי שטסטים לא יתנגשו (file lock) עם שרת dev שרץ במקביל על אותו קובץ H2,
# ושכל הרצת טסטים תתחיל מ-DB נקי לגמרי.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=always

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notifications.to=orbh490@gmail.com
app.admin.key=${ADMIN_KEY:}
app.base-url=${BASE_URL:http://localhost:8080}
