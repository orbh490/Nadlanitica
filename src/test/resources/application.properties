spring.application.name=nadlanitic
server.port=${PORT:8080}
# מאחורי ה-proxy של שרת האחסון, כתובת הלקוח האמיתית מגיעה ב-X-Forwarded-For. native = RemoteIpValve של Tomcat:
# קורא את הכותרת מימין ומאמין רק לכתובות proxy פנימיות, כך שלקוח לא יכול לזייף כתובת ולעקוף את הגבלת הלידים.
server.forward-headers-strategy=native
# DB בזיכרון, לא קובץ - כדי שטסטים לא יתנגשו (file lock) עם שרת dev שרץ במקביל על אותו קובץ H2,
# ושכל הרצת טסטים תתחיל מ-DB נקי לגמרי.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=never

# בדיקות אף פעם לא שולחות מייל אמיתי - "שרת" שלא קיים; הכישלון נרשם בלוג ולא מפיל כלום
spring.mail.host=localhost
spring.mail.port=1
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@example.test
app.mail.from-name=נדלניטיקה
app.contact-email=contact@example.test
app.notifications.to=alerts@example.test
app.admin.key=${ADMIN_KEY:}
app.base-url=${BASE_URL:http://localhost:8080}
