# מופעל דרך SPRING_PROFILES_ACTIVE=production - דורס את ברירת המחדל של H2 ב-application.properties.
# מסד הנתונים: PostgreSQL מנוהל (Neon). פרטי החיבור מגיעים ממשתני סביבה בלבד - לעולם לא נכתבים כאן או ב-git:
# PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD (ו-PG_PORT אם הוא לא 5432).
# sslmode=require: Neon מקבל רק חיבור מוצפן. Flyway יוצר את הטבלאות בעלייה הראשונה (db/migration).
spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT:5432}/${PG_DATABASE}?sslmode=require
spring.datasource.username=${PG_USER}
spring.datasource.password=${PG_PASSWORD}
# מסלולים חינמיים של Postgres מנוהל מגבילים את מספר החיבורים - מאגר קטן מספיק לאינסטנס יחיד
spring.datasource.hikari.maximum-pool-size=5
