# מופעל ב-Render דרך SPRING_PROFILES_ACTIVE=production - דורס את ברירת המחדל של H2 ב-application.properties.
# PG_HOST/PG_PORT/PG_DATABASE/PG_USER/PG_PASSWORD מגיעים מה-render.yaml (fromDatabase), לא מוגדרים כאן בכוונה -
# render.yaml מחבר אותם אוטומטית ממסד הנתונים המנוהל של Render.
spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}
spring.datasource.username=${PG_USER}
spring.datasource.password=${PG_PASSWORD}
