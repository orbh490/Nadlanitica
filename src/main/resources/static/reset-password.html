<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איפוס סיסמה</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16324a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="page" style="max-width:420px">
    <div class="card">
      <h2>קביעת סיסמה חדשה</h2>
      <label>סיסמה חדשה (לפחות 6 תווים) <input type="password" id="newPassword"></label>
      <button onclick="submitReset()">עדכנו סיסמה</button>
      <div id="resultMessage" style="margin-top:10px;font-size:13px"></div>
    </div>
  </div>
<script src="/js/app.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('resultMessage').style.color = '#b02a2a';
  document.getElementById('resultMessage').textContent = 'קישור לא תקין - יש לבקש קישור איפוס חדש ממסך ההתחברות';
}

async function submitReset() {
  const newPassword = document.getElementById('newPassword').value;
  const msgEl = document.getElementById('resultMessage');
  msgEl.style.color = '#8b93a6';
  msgEl.textContent = 'רגע...';
  const res = await fetch('/api/auth/reset-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, newPassword })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    msgEl.style.color = '#b02a2a';
    msgEl.textContent = data.message || 'שגיאה - נסו שוב';
    return;
  }
  setAuthToken(data.token);
  window.location.href = '/home.html';
}
</script>
</body>
</html>
