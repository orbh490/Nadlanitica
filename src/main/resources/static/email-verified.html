<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אימות אימייל</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16324a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="page" style="max-width:420px;text-align:center">
    <div class="card" id="confirmCard" style="display:none">
      <h2>אימות כתובת אימייל</h2>
      <p style="font-size:14px;color:var(--ink-secondary)">לחצו לאישור סופי של כתובת האימייל שלכם.</p>
      <button onclick="confirmVerify()">אשרו את כתובת האימייל</button>
      <div id="resultMessage" style="margin-top:10px;font-size:13px"></div>
    </div>
    <div class="card" id="successCard" style="display:none">
      <h2>האימייל אומת בהצלחה ✅</h2>
      <p style="font-size:14px;color:var(--ink-secondary)">אפשר להתחבר עכשיו.</p>
      <a class="btn" href="/index.html">למסך ההתחברות</a>
    </div>
    <div class="card" id="errorCard" style="display:none">
      <h2>הקישור אינו תקין או שפג תוקפו</h2>
      <p style="font-size:14px;color:var(--ink-secondary)">אפשר לבקש קישור אימות חדש ממסך ההתחברות.</p>
      <a class="btn" href="/index.html">למסך ההתחברות</a>
    </div>
  </div>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  const hasError = new URLSearchParams(window.location.search).has('error');
  document.getElementById(hasError || !token ? 'errorCard' : 'confirmCard').style.display = 'block';

  async function confirmVerify() {
    const msgEl = document.getElementById('resultMessage');
    msgEl.style.color = '#8b93a6';
    msgEl.textContent = 'רגע...';
    const res = await fetch('/api/auth/verify-confirm', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token })
    });
    if (!res.ok) {
      document.getElementById('confirmCard').style.display = 'none';
      document.getElementById('errorCard').style.display = 'block';
      return;
    }
    document.getElementById('confirmCard').style.display = 'none';
    document.getElementById('successCard').style.display = 'block';
  }
</script>
</body>
</html>
