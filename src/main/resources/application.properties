spring.application.name=nadlanitic
server.port=${PORT:8080}
# מאחורי ה-proxy של שרת האחסון, כתובת הלקוח האמיתית מגיעה ב-X-Forwarded-For. native = RemoteIpValve של Tomcat:
# קורא את הכותרת מימין ומאמין רק לכתובות proxy פנימיות, כך שלקוח לא יכול לזייף כתובת ולעקוף את הגבלת הלידים.
server.forward-headers-strategy=native
# פיתוח מקומי: H2 בקובץ, במצב תאימות ל-PostgreSQL - כך שאותן מיגרציות של Flyway רצות גם כאן וגם בפרודקשן.
# (קובץ חדש - analytics-db הישן נוצר ע"י ddl-auto=update ואין לו היסטוריית Flyway)
spring.datasource.url=jdbc:h2:file:./data/nadlanitica-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
# Flyway בונה את הטבלאות (src/main/resources/db/migration); Hibernate רק מוודא שהישויות תואמות להן
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=never

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notifications.to=orbh490@gmail.com
app.admin.key=${ADMIN_KEY:}
app.base-url=${BASE_URL:http://localhost:8080}

# ביצועים: דחיסת gzip לטקסט (HTML/CSS/JS/JSON), ושרשרת משאבים - כדי ש-@{...} בתבניות יקבל כתובת עם טביעת אצבע
# של התוכן (ראו WebViewConfig.addResourceHandlers)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml,application/xml,text/plain
server.compression.min-response-size=1024
spring.web.resources.chain.enabled=true
