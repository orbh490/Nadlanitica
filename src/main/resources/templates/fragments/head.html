<!DOCTYPE html>
<html lang="he" xmlns:th="http://www.thymeleaf.org">
<head>
<!--
  בלוק ה-head המשותף לכל דפי האפליקציה - פאבויקון, מניפסט, גופנים, app.css.
  לפני המעבר ל-fragments, כל שינוי כאן (כמו הוספת manifest.json) דרש עריכה זהה ב-8 קבצים בנפרד.
-->
<th:block th:fragment="common(title, description)"
    th:with="desc=${description} ?: 'הון עצמי, מס רכישה, סיכויי הגרלה ותשלום חודשי - כל התמונה האמיתית לפני שקונים דירה בישראל.',
             baseUrl=${@environment.getProperty('app.base-url')}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title}">נדלניטיקה</title>
<meta name="description" th:content="${desc}">
<!-- תצוגה מקדימה כשמשתפים קישור (וואטסאפ, פייסבוק וכו') -->
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:site_name" content="נדלניטיקה">
<meta property="og:title" th:content="${title}">
<meta property="og:description" th:content="${desc}">
<meta property="og:image" th:content="${baseUrl} + '/img/icon-512.png'">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B2238">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- רק האייקונים שבשימוש (3KB במקום 316KB של הגופן המלא). אייקון חדש באתר = להוסיף אותו כאן, ברשימה ממוינת לפי א"ב -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=accessibility_new,account_balance,apartment,bar_chart,confirmation_number,gavel,help,landscape,leaderboard,person,privacy_tip,settings,support_agent&display=block" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/css/mobile.css}" media="(max-width: 700px)">
<script th:src="@{/js/mobile.js}" defer></script>
<link rel="stylesheet" th:href="@{/css/prefs.css}">
<script th:src="@{/js/prefs.js}"></script>
<script>try { if (JSON.parse(localStorage.getItem('displayPrefs') || '{}').dark) document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
</th:block>
</head>
<body></body>
</html>
