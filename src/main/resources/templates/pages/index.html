<!DOCTYPE html>
<html lang="he" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/head :: common(title='נדלניטיקה')}"></th:block>
</head>
<body>
  <div class="page" style="max-width:420px">
    <div class="hero" style="text-align:center">
      <div class="hero-logo-badge" style="margin-inline:auto"><img src="/img/logo.png" alt="לוגו נדלניטיקה"></div>
      <h1>נדלניטיקה</h1>
      <p>הון עצמי, מס רכישה, סיכויי הגרלה ותשלום חודשי - כל התמונה האמיתית לפני שיוצאים לדרך.</p>
    </div>

    <div class="card">
      <h2>התחברות / הרשמה</h2>
      <label>אימייל <input type="email" id="authEmail"></label>
      <label>סיסמה (לפחות 6 תווים) <input type="password" id="authPassword"></label>
      <div class="checkbox-row">
        <input type="checkbox" id="consentCheckbox">
        <label for="consentCheckbox" style="margin:0;font-weight:400">קראתי ואני מסכים/ה ל<a href="/privacy.html" target="_blank">מדיניות הפרטיות</a> (נדרש להרשמה בלבד)</label>
      </div>
      <button onclick="handleLogin()">התחברות</button>
      <button class="secondary" onclick="handleRegister()">הרשמה</button>
      <p style="margin-top:10px"><a href="#" onclick="toggleForgotPassword();return false" style="font-size:12px">שכחתי סיסמה</a></p>
      <div id="forgotPasswordBox" style="display:none">
        <label>אימייל לאיפוס סיסמה <input type="email" id="forgotEmail"></label>
        <button class="secondary" onclick="submitForgotPassword()">שלחו קישור לאיפוס</button>
      </div>
      <div id="authMessage" style="margin-top:8px;font-size:13px"></div>
      <a href="#" id="resendVerificationLink" style="display:none;font-size:12px" onclick="resendVerification();return false">שלחו שוב מייל אימות</a>

      <hr style="margin:22px 0 16px;border:none;border-top:1px solid var(--border)">
      <button class="secondary" onclick="continueAsGuest()" style="width:100%;text-align:center">המשך כאורח/ת</button>
      <p style="font-size:12px;color:#8b93a6;margin-top:8px">בלי חשבון אפשר להשתמש בכל המחשבונים, אבל שום דבר לא נשמר אחרי שסוגרים את הדפדפן.</p>
    </div>

    <div th:replace="~{fragments/nav :: policy}"></div>
  </div>

<script src="/js/app.js"></script>
<script src="/js/pages/index.js"></script>
</body>
</html>
