<!DOCTYPE html>
<html lang="he" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/head :: common(title='נדלניטיקה', description='הון עצמי, מס רכישה, סיכויי הגרלה ותשלום חודשי - כל התמונה האמיתית לפני שקונים דירה בישראל.')}"></th:block>
</head>
<body>
  <div class="page" id="main" style="max-width:420px">
    <div class="hero" style="text-align:center">
      <div class="hero-logo-badge" style="margin-inline:auto"><img th:src="@{/img/logo.png}" alt="לוגו נדלניטיקה"></div>
      <h1>נדלניטיקה</h1>
      <p>הון עצמי, מס רכישה, סיכויי הגרלה ותשלום חודשי - כל התמונה האמיתית לפני שיוצאים לדרך.</p>
    </div>

    <div class="card">
      <div th:replace="~{fragments/auth :: form}"></div>

      <hr style="margin:22px 0 16px;border:none;border-top:1px solid var(--border)">
      <button class="secondary" data-click="continueAsGuest" style="width:100%;text-align:center">המשך כאורח/ת</button>
      <p style="font-size:12px;color:var(--ink-muted);margin-top:8px">בלי חשבון אפשר להשתמש בכל המחשבונים, אבל שום דבר לא נשמר אחרי שסוגרים את הדפדפן.</p>
    </div>

    <div th:replace="~{fragments/nav :: policy}"></div>
  </div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth-form.js}"></script>
<script th:src="@{/js/pages/index.js}"></script>
</body>
</html>
