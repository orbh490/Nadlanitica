# פריסה חינמית ל-Render: שירות web אחד במסלול החינמי, בלי מסד נתונים של Render (למסד החינמי שלהם יש תאריך תפוגה).
# מסד הנתונים הוא Neon (חינמי, בלי תפוגה) והמיילים יוצאים דרך הג'ימייל של הפרויקט - ראו docs/DEPLOY.md.
# כל הסיסמאות והכתובות (sync: false) מוזנות ידנית במסך Environment של Render - אף פעם לא בקובץ הזה.
services:
  - type: web
    name: nadlanitica
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /robots.txt
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PG_HOST
        sync: false
      - key: PG_DATABASE
        sync: false
      - key: PG_USER
        sync: false
      - key: PG_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: BASE_URL
        sync: false
